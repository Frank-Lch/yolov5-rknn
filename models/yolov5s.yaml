# Parameters
nc: 80 # number of classes
depth_multiple: 0.33 # model depth multiple 影响number 模型深度
width_multiple: 0.50 # layer channel multiple 影响模型宽度(channel_out)
anchors:
  - [10, 13, 16, 30, 33, 23] # P3/8
  - [30, 61, 62, 45, 59, 119] # P4/16
  - [116, 90, 156, 198, 373, 326] # P5/32

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]   args:[ch_out, kernel, stride, padding, groups]
  [
    [-1, 1, Conv, [64, 6, 2, 2]], # 0-P1/2  层数索引-特征金字塔的层级/下采样倍率  Conv又可以称为CBS，是由Conv2d + Batch + SiLU组成的模块
    [-1, 1, Conv, [128, 3, 2]], # 1-P2/4
    [-1, 3, C3, [128]], #CSP 不改变图像维度 侧路保留了原始信息，主干路学习了深层信息。两者结合，既不容易丢失细节，又能学到抽象特征
    [-1, 1, Conv, [256, 3, 2]], # 3-P3/8  只能识别最简单的几何特征 P3 对“位置”非常敏感，但不懂“语义”（不知道是什么）
    [-1, 6, C3, [256]], #4 小物体特征（128*80x80，视野小，细节多）P3
    [-1, 1, Conv, [512, 3, 2]], # 5-P4/16 256*40*40  几条线拼成了“三角形”，圆弧拼成了“圆圈”，纹理拼成了“毛皮” 它的认知：可能是眼睛，可能是轮胎，可能是把手
    [-1, 9, C3, [512]], #6 中物体特征（256*40x40）P4
    [-1, 1, Conv, [1024, 3, 2]], # 7-P5/32 512*20*20  对“语义”（是什么）非常敏感，但丢失了“细节位置”
    [-1, 3, C3, [1024]], #8
    [-1, 1, SPPF, [1024, 5]], # 9 P5 矩阵形状不变 但里面的每一个数字都包含了更广阔的视野信息，这对于检测大物体或者背景复杂的物体非常关键 大物体特征（512*20x20，视野大，语义强）
  ]

# YOLOv5 v6.0 head
head: [
    # neck
    [-1, 1, Conv, [512, 1, 1]], #10 通道减半 256*20*20 精简信息
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], #11 上采样图片放大两倍 256*40*40
    [[-1, 6], 1, Concat, [1]], #12 cat backbone P4  拼接11层与6层 512*40*40
    [-1, 3, C3, [512, False]], #13 融合特征，降通道 256*40*40  精简 统一格式 装订 消化  实现P5与P4的融合

    [-1, 1, Conv, [256, 1, 1]], #14 通道减半 128*40*40
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], #15 上采样图片放大两倍 128*80*80
    [[-1, 4], 1, Concat, [1]], # cat backbone P3 拼接15层与4层 256*80*80
    [-1, 3, C3, [256, False]], # 17 (P3/8-small) 融合特征，降通道 128*80*80 P4与P3融合 整个网络输出的第一个最终特征图（针对小目标）

    #P3开始回传高清细节
    [-1, 1, Conv, [256, 3, 2]], #18 下采样 128*40*40
    [[-1, 14], 1, Concat, [1]], # cat head P4 256*40*40 是为了把“新学的细节”和“之前的语义”再次结合
    [-1, 3, C3, [512, False]], # 20 (P4/16-medium) 256*40*40 整个网络输出的第二个最终特征图（针对中目标）

    [-1, 1, Conv, [512, 3, 2]], #21 下采样 256*20*20
    [[-1, 10], 1, Concat, [1]], # cat head P5 512*20*20
    [-1, 3, C3, [1024, False]], # 23 (P5/32-large) 512*20*20 输出的第三个最终特征图（针对大目标）

    #head
    [[17, 20, 23], 1, Detect, [nc, anchors]], # Detect(P3, P4, P5)
  ]
#输出通道=Anchors数量×(坐标4(中心偏移量+框的宽高)+置信度1+类别80)
#在这个格子上，我用 3个不同的模具 去尝试预测。
#对于每一个模具，我都要算出：
#4个坐标（怎么微调模具变成真实物体）
#1个置信度（这模具里有东西吗）
#80个类别（这东西是猫还是狗）

# 输出矩阵 [1, 3, 80, 80, 85]  [1, 3, 40, 40, 85] [1, 3, 20, 20, 85]

#最终输出矩阵形状：[1, 25200, 85]
